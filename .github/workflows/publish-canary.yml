name: Publish Canary

on:
  push:
    branches-ignore:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: {}

concurrency:
  group: publish-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Compute canary version
        id: canary
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          RUN_NO=${GITHUB_RUN_NUMBER:-0}
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          CANARY_VERSION="${BASE_VERSION}-canary.${RUN_NO}.${SHORT_SHA}"
          npm pkg set version="${CANARY_VERSION}"
          echo "version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish canary to npm
        shell: bash
        env:
          FALLBACK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if npm publish --tag canary --access public; then
            exit 0
          fi

          if [ -z "${FALLBACK_NPM_TOKEN}" ]; then
            echo "Trusted publishing failed and NPM_TOKEN is not configured." >&2
            exit 1
          fi

          echo "Trusted publishing failed, retrying with NPM_TOKEN." >&2
          NODE_AUTH_TOKEN="${FALLBACK_NPM_TOKEN}" npm publish --tag canary --access public
