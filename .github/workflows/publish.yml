name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Check if publish is needed
        id: publish_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @hol-org/hashnet-mcp version 2>/dev/null || echo "0.0.0")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PKG_VERSION" = "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already published (npm latest is $PUBLISHED)."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $PKG_VERSION (npm latest is $PUBLISHED)."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.publish_check.outputs.publish == 'true'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
